<div class="rating">

  <span class="rating__stars">
    @for (filled of stars; track $index) {
      <svg
        [class.is-filled]="filled"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path d="M10 1l2.6 5.9 6.4.6-4.8 4.3 1.4 6.2L10 14.9 4.4 18l1.4-6.2L1 7.5l6.4-.6Z" />
      </svg>
    }
  </span>

  @if (count !== undefined) {
    <span class="rating__count">({{ count }})</span>
  }

</div>
